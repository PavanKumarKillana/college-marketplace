name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: college-marketplace-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository onto the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::523109312493:role/college-marketplace-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Use the Git commit SHA as the Docker image tag
      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 5. Build the backend Docker image
      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./Backend

      # 6. Push the image to ECR
      - name: Push backend image to ECR
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # 7. Deploy backend to EC2
      - name: Deploy backend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' AWS_REGION='$AWS_REGION' bash -s" <<'REMOTE_SCRIPT'

            set -e

            CONTAINER="college-marketplace-api"

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" |
              docker login \
                --username AWS \
                --password-stdin \
                523109312493.dkr.ecr.ap-south-1.amazonaws.com

            echo "Pulling new image..."

            docker pull "$IMAGE"

            OLD_IMAGE=""

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              OLD_IMAGE=$(docker inspect "$CONTAINER" \
                --format '{{.Config.Image}}')
            fi

            echo "Old image: $OLD_IMAGE"
            echo "New image: $IMAGE"

            echo "Stopping old container..."

            docker stop "$CONTAINER" || true

            echo "Removing old container..."

            docker rm "$CONTAINER" || true

            echo "Starting new container..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --env-file /home/ubuntu/app.env \
              -p 127.0.0.1:3000:3000 \
              "$IMAGE"

            echo "Waiting for application..."

            sleep 5

            echo "Checking application..."

            if curl -fsS --max-time 10 http://127.0.0.1:3000/ >/dev/null; then
              echo "Backend is responding."
            else
              echo "New backend failed health check."

              echo "Showing container logs:"
              docker logs --tail 100 "$CONTAINER" || true

              echo "Rolling back..."

              docker stop "$CONTAINER" || true
              docker rm "$CONTAINER" || true

              if [ -n "$OLD_IMAGE" ]; then
                docker run -d \
                  --name "$CONTAINER" \
                  --restart unless-stopped \
                  --env-file /home/ubuntu/app.env \
                  -p 127.0.0.1:3000:3000 \
                  "$OLD_IMAGE"

                echo "Rollback completed."
              fi

              exit 1
            fi

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Backend deployment successful."

            docker ps

          REMOTE_SCRIPT

      # 8. Deploy frontend files
      - name: Deploy frontend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key \
            -r Frontend/* \
            "$EC2_USER@$EC2_HOST:/var/www/college-marketplace/"

          echo "Frontend deployment successful."
