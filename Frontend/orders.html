<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — SnackDen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand">
        <img src="amrita_logo.png" alt="Amrita">
        <div>
            <span class="brand-name">SnackDen</span>
            <span class="brand-sub">Amrita Campus Marketplace</span>
        </div>
    </a>
    <a href="index.html" class="nav-link">🏠 Home</a>
    <button class="nav-btn nav-btn-danger" onclick="logout()">Logout</button>
</nav>

<div id="toast-container"></div>

<div class="page">
    <p class="section-heading">📦 My Orders</p>
    <div id="orders" style="max-width:760px; margin:0 auto;"></div>
</div>

<!-- CHAT MODAL -->
<div id="chat-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div class="card" style="width:90%; max-width:500px; background:var(--surface); padding:20px; border-radius:12px; max-height:85vh; display:flex; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 id="chat-modal-title" style="margin:0;">💬 Order Chat</h3>
            <button onclick="closeChatModal()" style="background:none; border:none; color:var(--text); font-size:1.2rem; cursor:pointer;">✖</button>
        </div>
        <div id="chat-messages-box" style="flex:1; overflow-y:auto; min-height:220px; max-height:350px; background:var(--surface-2); padding:12px; border-radius:8px; margin-bottom:12px;"></div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="chat-input" placeholder="Type your message…" class="input-field" style="margin:0;" onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="btn btn-primary" onclick="sendChatMessage()">Send</button>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="orders.js"></script>
</body>
</html>
