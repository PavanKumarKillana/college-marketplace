<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="card nav-links" style="margin-bottom:30px;padding:15px 30px;">
    <a href="index.html">Home</a>
    <button class="cart-btn small-btn"
            onclick="logout()"
            style="background:#ff4b2b;">
        Logout
    </button>
</nav>

<div class="card" style="max-width:1100px;margin:0 auto 20px auto;">
    <h2>⚙️ Admin Control Center</h2>
    <p style="color:var(--text-2);">
        Manage users, products and orders.
    </p>
</div>

<div class="card" style="max-width:1100px;margin:0 auto 20px auto;">
    <h2>👥 Users</h2>
    <div id="users">
        <p>Loading users...</p>
    </div>
</div>

<div class="card" style="max-width:1100px;margin:0 auto 20px auto;">
    <h2>📦 Products</h2>
    <div id="products">
        <p>Loading products...</p>
    </div>
</div>

<div class="card" style="max-width:1100px;margin:0 auto 20px auto;">
    <h2>🚨 Moderation Reports Queue</h2>
    <div id="reports">
        <p>Loading reports...</p>
    </div>
</div>

<div class="card" style="max-width:1100px;margin:0 auto 20px auto;">
    <h2>🏫 Hostel / Building Management</h2>
    <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
        <input type="text" id="new-hostel-name" placeholder="Hostel Name (e.g., Amritam Hostel)" class="input-field" style="flex:2; margin:0;">
        <input type="text" id="new-hostel-code" placeholder="Code (e.g., AMR)" class="input-field" style="flex:1; margin:0;">
        <button class="btn btn-primary" onclick="addHostel()">+ Add Hostel</button>
    </div>
    <div id="hostels-list">
        <p>Loading hostels...</p>
    </div>
</div>

<div class="card" style="max-width:1100px;margin:0 auto;">
    <h2>🧾 Orders</h2>
    <div id="orders">
        <p>Loading orders...</p>
    </div>
</div>

<script src="api.js"></script>
<script src="admin.js"></script>

</body>
</html>
