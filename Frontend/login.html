<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SnackDen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo-wrap">
            <img src="amrita_logo.png" alt="Amrita University Logo">
            <div>
                <span class="auth-brand-name">SnackDen</span>
                <span class="auth-brand-sub">Amrita Campus Marketplace</span>
            </div>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form">
            <h3>Welcome back 👋</h3>
            <input type="email" id="login-email" placeholder="College email" class="input-field">
            <input type="password" id="login-password" placeholder="Password" class="input-field"
                   onkeydown="if(event.key==='Enter') loginUser()">
            <button class="btn btn-primary btn-full" style="margin-top:14px;" onclick="loginUser()">
                Login →
            </button>
            <p class="auth-footer">
                New to SnackDen?
                <button class="toggle-link" onclick="toggleAuth()">Create account</button>
            </p>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" style="display:none;">
            <h3>Join SnackDen 🎉</h3>
            <input type="text"     id="reg-name"     placeholder="Your name"              class="input-field">
            <input type="email"    id="reg-email"    placeholder="College email"           class="input-field">
            <input type="password" id="reg-password" placeholder="Password"                class="input-field">
            <input type="text"     id="reg-room"     placeholder="Room number (optional)"  class="input-field">
            <p style="font-size:0.78rem; color:var(--text-2); margin:8px 0;">
                Everyone joins as a <strong>shopper</strong>. You can become a seller anytime from the home page.
            </p>
            <button class="btn btn-primary btn-full" style="margin-top:10px;" onclick="registerUser()">
                Create account →
            </button>
            <p class="auth-footer">
                Already have an account?
                <button class="toggle-link" onclick="toggleAuth()">Login</button>
            </p>
        </div>

    </div>
</div>

<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
